# ---------------------------------------------------------------------------
# Family Success Planner - configuration
#
#   python planner.py build                 # uses ./family.yaml if it exists
#   python planner.py build -c mine.yaml
#
# Every setting below is optional; delete anything you don't want to change.
#
# Text limits, in characters: family_name 60, title 80, subtitle 120,
# cover_text 80, cover_line 80, output_name 120, each member name 40, month
# name 30, accent 20, motif 40, tagline and footer 120. Longer text is refused
# with a message naming the field. Line breaks and tabs in text become spaces.
# ---------------------------------------------------------------------------

# The planner year. Monthly grids and the year-at-a-glance page are dated from
# this, so 2028 or 2031 works exactly as well as 2027.
year: 2027

# Shown on the cover of Blank, the retired looks and the layouts. The
# thirteen looks have their own cover wording and do not print these.
title: Family Success Planner
subtitle: Plan Together. Grow Together. Succeed Together.

# Used in the output filename. Blank, the retired looks and the layouts print
# "The <name> Family" on the cover; a look cover prints it only when
# cover_show_family (below) is true. Leave blank for a generic planner.
family_name: ""

# "sunday" matches the reference planner. "monday" gives ISO weeks.
week_starts: sunday

# true  -> monthly grids carry real dates for `year`
# false -> blank grids you fill in yourself (good for gifting or reprinting)
dated_months: true

# The year on the Family Goals and annual calendar mastheads, and on the
# cover of Blank, the retired looks and the layouts. Dated books print
# `cover_text` if set, otherwise `year`. When dated_months is false, those
# places default to fill-in blanks unless you set:
#   cover_text  print this line instead (e.g. Our, 2027-2028)
#   auto/blank  four write-on slots
#   omit        no year on those pages
#   print       still print cover_text or the configured year
cover_year: auto
cover_text: ""

# Your own words on the cover of one of the thirteen looks. All three are off
# by default, so the cover prints exactly as designed. What you turn on
# prints in one small spot, in the look's own fonts and colours; long lines
# print smaller so they stay in that spot. Blank, the retired looks and the
# layouts ignore these three.
#   cover_show_family  true prints "The <family_name> Family" (needs a name)
#   cover_show_year    off, year (the planner year) or custom (cover_text)
#   cover_line         one extra line of your own, up to 80 characters
cover_show_family: false
cover_show_year: "off"
cover_line: ""

# One row per person on the health tracker. Names are optional - an empty
# string prints a blank line to write on. Add or remove entries to change how
# many rows the tracker has.
members:
  - ""
  - ""
  - ""
  - ""
  - ""

# 5.5x8, 6x9, or letter (8.5x11in)
page_size: letter

# Overrides the generated filename stem. Leave blank for "<year>-<family>-Family-Planner".
output_name: ""

# Adds tab-rail navigation and a linked index page, for reading on a tablet
# (31 pages). Same as `build --linked`.
# linked: false

# Typefaces. There are 52 sets. Either a set name:
#   classic  playful  modern  elegant  italics  neat
# or one of the others: each look's own set (editorial uses home-edition,
# Bodoni Moda and Archivo), the layout sets such as `ledger`, or pairings
# such as `boho-brush` (once called `terracotta`; that name still works),
# or any three Google Fonts families of your own:
#   fonts:
#     display: Chewy
#     script: Gloria Hallelujah
#     body: Rubik
# Run `python planner.py typefaces` to see the sets. Their font files ship
# in the repo; for families of your own, run `python planner.py fonts` once.
# Leave fonts unset to use the look's own set (each look and layout below
# has one). Blank and the retired looks use elegant when fonts is unset.
# fonts: elegant

# How the book looks. Each look has its own cover, monthly page, worksheet
# chrome, colours and typefaces:
#   editorial   red nameplate, Bodoni      midcentury  teal, mustard, rust shapes
#   nordic      oat, clay and sage         farmhouse   grain-sack stripe, barn red
#   deco        navy and champagne gold    swiss       black, white, one red
#   retro       rainbow arcs, 70s browns   bauhaus     cobalt, coral, butter blocks
#   almanac     oxblood cloth, gold rules  terracotta  sand, clay, plum arches
#   cottage     sage gingham, blush        gazette     newsprint, blackletter
#   coastal     navy Breton stripe
# A look brings its own colours, so `theme:` below has no effect on it; your
# own palette: block still wins.
# `blank` strips art. The retired looks (original, 02-17) still build from old
# plan files but are no longer offered.
# Planner layouts cross a look with a page structure: `02a` `02b` `02c`,
# `06a` `06b` `06c`, `11a` `11b` `11c`, `12a` `12b` `12c` (a split, b stacked,
# c sidebar). They keep the look's colours, use a boxed monthly page and add
# `weekly` and `daily` sheets before the months (32 pages). Each layout has
# its own cover. `python planner.py build --help` lists every id. Their
# typeface sets apply unless you set fonts: 02 ledger, 06 composition-book,
# 11 boardroom, 12 garden-party.
design: editorial

# Point sizes. The visual editor has sliders and type-in fields for these.
# type_size:
#   title: 30
#   cover: 66
#   body: 9
#   script: 13

# A colour preset applied before `palette:` below. One of:
#   linen  classic  amber  berry  bold  citrus  forest  meadow  ocean  pastel  poppy  blues
# `linen` is the default (warm taupe, dusty rose and clay on ivory). `classic` is the original
# bright jewel-tone printable.
# Run `python planner.py themes` to see them. A theme colours the Blank look
# and the retired looks only; the thirteen looks and the layouts bring their
# own colours, and `build` prints a note if you name a theme they ignore.
# Anything under `palette:` overrides the theme, so you can start from
# `forest` and change one colour.
theme: linen

# ---------------------------------------------------------------------------
# Colours. Every page pulls from this palette, so changing `teal` here restyles
# the teal elements across all 30 pages at once.
#
# These are the twelve tokens and their `linen` values. Uncomment only the
# ones you want to change - anything you set here is applied ON TOP of `theme`
# above (or of the look's own colours), so uncommenting the whole block would
# pin every colour and make the theme setting do nothing.
# ---------------------------------------------------------------------------
# palette:
#   navy:   "#5C4A3A"
#   teal:   "#9C8768"
#   pink:   "#CBA89C"
#   orange: "#C9956A"
#   green:  "#A6A283"
#   purple: "#A69088"
#   blue:   "#8C8577"
#   red:    "#B56858"
#   brown:  "#8A6B52"
#   ink:    "#3D362C"
#   paper:  "#F6F1E8"
#   rule:   "#DDD6CC"

# ---------------------------------------------------------------------------
# Which pages to build, in order. "months" expands to the twelve monthly
# planners. Run `python planner.py pages` to see the result.
# Comment out a line to drop that page from the book.
# ---------------------------------------------------------------------------
pages:
  - cover
  - belongs_to
  - how_to_use
  - vision_mission
  - year_goals
  - values
  - annual_calendar
  - budget
  - chores
  - meal_plan
  - grocery
  - health_tracker
  - emergency
  - school_activities
  - family_time
  - months
  - vacation
  - home_maintenance
  - year_end

# ---------------------------------------------------------------------------
# Per-month styling. Positional - the first entry is January. You may supply
# fewer than twelve; the rest keep their defaults. Any key you leave out keeps
# its default too. Run `python planner.py months` to see the current table.
# Only Blank and the retired looks print these. The thirteen looks and the
# layouts have their own month pages, which use the month names only.
#
#   accent: season (the default: the month's season colour, the same in
#           every design) or a palette colour name such as teal
#   motif:  snowman | hearts | sprout | tulips | flowers | sun | beach
#           school | pumpkin | leaves | snowflake
# ---------------------------------------------------------------------------
months:
  - {}                                       # January - keep defaults
  - {tagline: "Love Grows Here"}             # February
