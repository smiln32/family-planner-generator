# ---------------------------------------------------------------------------
# Family Success Planner - configuration
#
#   python planner.py build                 # uses ./family.yaml if it exists
#   python planner.py build -c mine.yaml
#
# Every setting below is optional; delete anything you don't want to change.
# ---------------------------------------------------------------------------

# The planner year. Monthly grids and the year-at-a-glance page are dated from
# this, so 2028 or 2031 works exactly as well as 2027.
year: 2027

# Shown on the cover.
title: Family Success Planner
subtitle: Plan Together. Grow Together. Succeed Together.

# Printed on the cover as "The <name> Family" and used in the output filename.
# Leave blank for a generic planner.
family_name: ""

# "sunday" matches the reference planner. "monday" gives ISO weeks.
week_starts: sunday

# true  -> monthly grids carry real dates for `year`
# false -> blank grids you fill in yourself (good for gifting or reprinting)
dated_months: true

# Dated books print `cover_text` if set, otherwise `year`. When dated_months
# is false, the cover (and Family Goals / annual calendar mastheads) default
# to fill-in blanks unless you set:
#   cover_text  print this line instead (e.g. Our, 2027-2028)
#   auto/blank  four write-on slots
#   omit        no year on those pages
#   print       still print cover_text or the configured year
cover_year: auto
cover_text: ""

# One row per person on the health tracker. Names are optional - an empty
# string prints a blank line to write on. Add or remove entries to change how
# many rows the tracker has.
members:
  - ""
  - ""
  - ""
  - ""
  - ""

# 5.5x8, 6x9, or letter (8.5x11in)
page_size: letter

# Overrides the generated filename stem. Leave blank for "<year>-<family>-Family-Planner".
output_name: ""

# Adds tab-rail navigation and a linked index page, for reading on a tablet
# (31 pages). Same as `build --linked`.
# linked: false

# Typefaces. Either a set name:
#   classic  playful  modern  elegant  italics  neat
# or any three Google Fonts families of your own:
#   fonts:
#     display: Chewy
#     script: Gloria Hallelujah
#     body: Rubik
# Run `python planner.py typefaces` to see the sets, then
# `python planner.py fonts` to download whichever you picked.
fonts: elegant

# How the sheets are dressed. `original` is this book. `02` boxed records,
# `03` botanical, `04` marker journal, `05` soft intention. `06`–`10` are
# other languages. `11`–`17` are more daily-planner looks. `blank` strips art.
# Looks `02`–`17` are unfinished; see shared/looks-handoff.md before using one.
design: original

# Point sizes. The visual editor has sliders and type-in fields for these.
# type_size:
#   title: 30
#   cover: 66
#   body: 9
#   script: 13

# A colour preset applied before `palette:` below. One of:
#   linen  classic  amber  berry  bold  citrus  forest  meadow  ocean  pastel  poppy  blues
# `linen` is the default (warm beige, ivory). `classic` is the original
# bright jewel-tone printable.
# Run `python planner.py themes` to see them. Anything under `palette:`
# overrides the theme, so you can start from `forest` and change one colour.
theme: linen

# ---------------------------------------------------------------------------
# Colours. Every page pulls from this palette, so changing `teal` here restyles
# the teal elements across all 30 pages at once.
#
# These are the twelve tokens and their `linen` values. Uncomment only the
# ones you want to change - anything you set here is applied ON TOP of `theme`
# above, so uncommenting the whole block would pin every colour and make the
# theme setting do nothing.
# ---------------------------------------------------------------------------
# palette:
#   navy:   "#3E5344"
#   teal:   "#5F7A62"
#   pink:   "#C4A09A"
#   orange: "#C9956A"
#   green:  "#8AA084"
#   purple: "#A0909C"
#   blue:   "#7A8B88"
#   red:    "#B56858"
#   brown:  "#8A6B52"
#   ink:    "#3A3F3A"
#   paper:  "#F6F1E8"
#   rule:   "#DDD6CC"

# ---------------------------------------------------------------------------
# Which pages to build, in order. "months" expands to the twelve monthly
# planners. Run `python planner.py pages` to see the result.
# Comment out a line to drop that page from the book.
# ---------------------------------------------------------------------------
pages:
  - cover
  - belongs_to
  - how_to_use
  - vision_mission
  - year_goals
  - values
  - annual_calendar
  - budget
  - chores
  - meal_plan
  - grocery
  - health_tracker
  - emergency
  - school_activities
  - family_time
  - months
  - vacation
  - home_maintenance
  - year_end

# ---------------------------------------------------------------------------
# Per-month styling. Positional - the first entry is January. You may supply
# fewer than twelve; the rest keep their defaults. Any key you leave out keeps
# its default too. Run `python planner.py months` to see the current table.
#
#   accent: a palette colour name
#   motif:  snowman | hearts | sprout | tulips | flowers | sun | beach
#           school | pumpkin | leaves | snowflake
# ---------------------------------------------------------------------------
months:
  - {}                                       # January - keep defaults
  - {tagline: "Love Grows Here"}             # February
