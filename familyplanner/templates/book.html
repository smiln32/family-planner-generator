<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ cfg.year }} {{ cfg.title }}{% if cfg.family_name %} - {{ cfg.family_name }}{% endif %}</title>
<style>
{{ fonts_css|safe }}

:root {
  --page-w: {{ page_width_in }}in;
  --page-h: {{ page_height_in }}in;
  /* One printed margin for every sheet in the book. */
  --page-pad-top: 0.3in;
  --page-pad-side: 0.32in;
  --page-pad-bottom: 0.26in;
  /* Scale of a letter-laid worksheet on a smaller page (render.page_zoom). */
  --page-zoom: {{ page_zoom }};
{% for name, value in cfg.palette.items() %}
  --{{ name }}: {{ value }};
{% endfor %}
  /* Colour roles (colours.py, _config/design-system.md): one structure
     colour, one weekend accent, four season colours, and the text colour
     that reads on each (-on). */
{% for name, value in roles.items() %}
  --c-{{ name }}: {{ value }};
{% endfor %}
  --font-display: {{ font_display|safe }};
  --font-script: {{ font_script|safe }};
  --font-body: {{ font_body|safe }};
  --type-title: {{ cfg.type_size.title }}pt;
  --type-cover: {{ cfg.type_size.cover }}pt;
  --type-body: {{ cfg.type_size.body }}pt;
  --type-script: {{ cfg.type_size.script }}pt;
{% if recipe_tokens %}
  /* The design's recipe (chrome.Recipe): type scale, spacing and text
     colour, read by static/recipes.css. */
{% for name, value in recipe_tokens.items() %}
  {{ name }}: {{ value|safe }};
{% endfor %}
{% endif %}
}

{{ css|safe }}

{% if standalone %}
/* One page on its own, for the preview pane: no contact-sheet chrome, so the
   sheet fills its frame exactly and the frame never needs to scroll. */
@media screen {
  body { padding: 0; background: #fff; }
  .page { margin: 0; box-shadow: none; }
}
{% endif %}
</style>
</head>
<body class="{% if page_zoom < 1 %}small-page {% endif %}design-{{ look.base }}{% if look.base in looks %} lk{% endif %}{% if look.layout %} design-{{ cfg.design }} layout box-{{ look.box }}{% endif %}{% if chrome_classes %} {{ chrome_classes }}{% endif %}">
{% include "icons.html" %}
{% for body in bodies %}
{{ body|safe }}
{% endfor %}
</body>
</html>
