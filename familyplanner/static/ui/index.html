<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Success Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 12 8 42h84z' fill='%2316325F'/%3E%3Crect x='18' y='40' width='64' height='48' fill='%2314A0A5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui/ui.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 200 150" aria-hidden="true">
      <path d="M12 128c42-15 134-15 176 0v8c-42-15-134-15-176 0z" fill="var(--green)"/>
      <rect x="140" y="26" width="13" height="26" rx="2" fill="var(--navy)"/>
      <path d="M100 14 18 62h164z" fill="none" stroke="var(--navy)" stroke-width="11"
            stroke-linejoin="round"/>
      <rect x="38" y="60" width="7" height="66" fill="var(--navy)"/>
      <rect x="155" y="60" width="7" height="66" fill="var(--navy)"/>
      <g fill="var(--teal)">
        <rect x="86" y="44" width="12" height="12" rx="1.5"/>
        <rect x="102" y="44" width="12" height="12" rx="1.5"/>
        <rect x="86" y="60" width="12" height="12" rx="1.5"/>
        <rect x="102" y="60" width="12" height="12" rx="1.5"/>
      </g>
      <path d="M146 22c0-6 5-10 10-10 3 0 5 1 6 3 1-2 3-3 6-3 5 0 10 4 10 10 0 8-11 15-16 19-5-4-16-11-16-19z"
            fill="var(--pink)"/>
    </svg>
    <div class="brand-text">
      <strong>Family Success Planner</strong>
      <span id="brand-sub">30 pages &middot; letter</span>
    </div>
  </div>

  <div class="topbar-actions">
    <button id="save" class="btn btn-ghost" type="button">Save config</button>
    <button id="build" class="btn btn-primary" type="button">
      <span class="btn-label">Build PDF</span>
    </button>
  </div>
</header>

<main class="shell">
  <aside class="panel" aria-label="Planner settings">
    <section class="group">
      <h2>Planner</h2>
      <div class="field-row">
        <label for="year">Year</label>
        <input id="year" type="number" min="1900" max="2999" step="1" value="2027">
      </div>
      <div class="field-row">
        <label for="family">Family name</label>
        <input id="family" type="text" placeholder="optional" autocomplete="off">
      </div>
      <div class="field-row">
        <label for="size">Paper</label>
        <select id="size">
          <option value="letter">Letter &mdash; 8.5 &times; 11 in</option>
          <option value="a4">A4 &mdash; 210 &times; 297 mm</option>
        </select>
      </div>
      <div class="field-row">
        <label for="week">Week starts</label>
        <select id="week">
          <option value="sunday">Sunday</option>
          <option value="monday">Monday</option>
        </select>
      </div>
      <label class="switch">
        <input id="dated" type="checkbox" checked>
        <span class="track" aria-hidden="true"></span>
        <span class="switch-text">
          <strong>Print real dates</strong>
          <em>Off gives blank grids to fill in by hand</em>
        </span>
      </label>
    </section>

    <section class="group">
      <h2>Colour</h2>
      <div id="themes" class="swatch-grid" role="radiogroup" aria-label="Colour theme"></div>
    </section>

    <section class="group">
      <h2>Type</h2>
      <div id="typefaces" class="type-grid" role="radiogroup" aria-label="Typeface set"></div>
    </section>

    <section class="group">
      <h2>Family <span class="hint">tracker rows</span></h2>
      <div id="members" class="members"></div>
      <button id="add-member" class="btn btn-quiet" type="button">Add a person</button>
    </section>

    <section class="group">
      <div class="group-head">
        <h2>Pages</h2>
        <button id="reset-pages" class="linky" type="button">reset</button>
      </div>
      <div id="pages" class="pages"></div>
    </section>
  </aside>

  <section class="stage" aria-label="Preview">
    <div class="stage-bar">
      <label class="sr-only" for="preview-page">Page to preview</label>
      <select id="preview-page"></select>
      <div class="zoom">
        <button id="zoom-out" class="icon-btn" type="button" aria-label="Zoom out">&minus;</button>
        <span id="zoom-level">Fit</span>
        <button id="zoom-in" class="icon-btn" type="button" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div id="canvas" class="canvas">
      <div id="sheet" class="sheet">
        <iframe id="preview" title="Page preview" sandbox="allow-same-origin"></iframe>
      </div>
      <div id="spinner" class="spinner" hidden><span></span></div>
    </div>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/ui/ui.js"></script>
</body>
</html>
